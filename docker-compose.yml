services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    environment:
      NODE_ENV: development
      LOCAL_DEVELOPMENT_AUTH: "true"
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://office:office@db:5432/office?schema=public
      INVITATION_TOKEN_SECRET: local-development-invitation-secret-change-me
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
