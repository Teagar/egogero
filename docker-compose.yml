services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    environment:
      NODE_ENV: development
      LOCAL_DEVELOPMENT_AUTH: "true"
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://office:office@db:5432/office?schema=public
      INVITATION_TOKEN_SECRET: local-development-invitation-secret-change-me
      IDEMPOTENCY_CACHE_SECRET: local-development-idempotency-cache-secret-change-me
      DEVICE_API_KEY_SECRET: local-development-device-api-key-secret-change-me
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy

  anonymize:
    profiles: ["jobs"]
    build: .
    command: ["sh", "-c", "npm run db:migrate:deploy && sh scripts/run-anonymization-job.sh"]
    environment:
      DATABASE_URL: postgresql://office:office@db:5432/office?schema=public
      ANONYMIZATION_RETENTION_MONTHS: "12"
      ANONYMIZATION_BATCH_SIZE: "500"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  delivery-worker:
    profiles: ["workers"]
    build: .
    command: ["sh", "-c", "npm run db:migrate:deploy && npm run delivery:worker"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://office:office@db:5432/office?schema=public
      IDEMPOTENCY_CACHE_SECRET: local-development-idempotency-cache-secret-change-me
      DELIVERY_BATCH_SIZE: "50"
      DELIVERY_CONCURRENCY: "5"
      DELIVERY_LEASE_MS: "60000"
      DELIVERY_PROVIDER_TIMEOUT_MS: "30000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
